name: PocketPager
options:
  bundleIdPrefix: com.houlahop
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "18.0"
    macOS: "15.0"
configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.4.0"
    CURRENT_PROJECT_VERSION: "3"
    CODE_SIGN_STYLE: Automatic
packages:
  PagerKit:
    path: PagerKit
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS
    majorVersion: 9.0.0
  HoulahopUpdater:
    path: ../scripts/mac-release
targets:
  PocketPager-iOS:
    type: application
    platform: iOS
    sources:
      - iOSApp
      - Shared
    dependencies:
      - package: PagerKit
      - package: GoogleSignIn
    info:
      path: iOSApp/Info.plist
      properties:
        CFBundleDisplayName: Pocket Pager
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIBackgroundModes: [remote-notification]
        PagerioAPIBaseURL: $(PAGERIO_API_BASE_URL)
        PagerioApsEnvironment: $(APS_ENVIRONMENT)
        GIDClientID: $(GOOGLE_CLIENT_ID_IOS)
        CFBundleURLTypes:
          - CFBundleURLSchemes: [$(GOOGLE_REVERSED_CLIENT_ID_IOS)]
        ITSAppUsesNonExemptEncryption: false
    entitlements:
      path: iOSApp/PocketPager-iOS.entitlements
      properties:
        aps-environment: $(APS_ENVIRONMENT)
        com.apple.developer.usernotifications.time-sensitive: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.houlahop.pagerio
        PRODUCT_NAME: Pocket Pager
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: PagerIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
  PocketPager-macOS:
    type: application
    platform: macOS
    sources:
      - MacApp
      - Shared
    dependencies:
      - package: PagerKit
      - package: GoogleSignIn
      - package: HoulahopUpdater
    info:
      path: MacApp/Info.plist
      properties:
        CFBundleDisplayName: Pocket Pager
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSUIElement: true
        PagerioAPIBaseURL: $(PAGERIO_API_BASE_URL)
        GIDClientID: $(GOOGLE_CLIENT_ID_MACOS)
        CFBundleURLTypes:
          - CFBundleURLSchemes: [$(GOOGLE_REVERSED_CLIENT_ID_MACOS)]
        ITSAppUsesNonExemptEncryption: false
        # Sparkle: scripts/release.sh uploads appcast.xml to each GitHub release, so "latest" always points to the newest one.
        SUFeedURL: https://github.com/plosson/pagerio/releases/latest/download/appcast.xml
        SUPublicEDKey: dabwyVo5evcJjXBoaCQtB6VFuuAHbfrYdzWrG80QMSQ=
        SUEnableAutomaticChecks: true
        # The app is sandboxed: Sparkle installs updates through its XPC installer service.
        SUEnableInstallerLauncherService: true
    entitlements:
      path: MacApp/PocketPager-macOS.entitlements
      properties:
        com.apple.developer.aps-environment: $(APS_ENVIRONMENT)
        com.apple.developer.usernotifications.time-sensitive: true
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        # Lets the sandboxed app reach Sparkle's installer (SUEnableInstallerLauncherService).
        com.apple.security.temporary-exception.mach-lookup.global-name:
          - $(PRODUCT_BUNDLE_IDENTIFIER)-spks
          - $(PRODUCT_BUNDLE_IDENTIFIER)-spki
        keychain-access-groups:
          - $(AppIdentifierPrefix)com.houlahop.pagerio.mac
          - $(AppIdentifierPrefix)com.google.GIDSignIn
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.houlahop.pagerio.mac
        PRODUCT_NAME: Pocket Pager
        # Notarization refuses executables without the hardened runtime.
        ENABLE_HARDENED_RUNTIME: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: PagerIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
      configs:
        # The APNs sandbox treats Macs as offline and holds pages back for minutes or hours, so Mac release builds use production.
        # Only a Developer ID export is signed for production: Xcode builds use Apple Development, whose profile only allows the sandbox.
        # The app reads its signed entitlement at launch, so it always reports the environment it really has.
        Release:
          APS_ENVIRONMENT: production
